<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anexo curricular de inteligencia artificial · DC Primario GCBA 2024</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pur-bg:#EEEDFE; --pur-text:#3C3489; --pur-border:#AFA9EC;
    --tea-bg:#E1F5EE; --tea-text:#085041; --tea-border:#5DCAA5;
    --blu-bg:#E6F1FB; --blu-text:#0C447C; --blu-border:#A8CCF0;
    --amb-bg:#FAEEDA; --amb-text:#633806; --amb-border:#E5C988;
    --cor-bg:#FAECE7; --cor-text:#712B13; --cor-border:#E5A98C;
    --grn-bg:#EAF3DE; --grn-text:#27500A; --grn-border:#9CCC65;
    --radius:10px; --shadow:0 1px 4px rgba(0,0,0,.08);
    font-family:'Archivo',sans-serif;
  }
  body { background:#f8fafc; color:#1e293b; font-size:14px; line-height:1.55; }

  /* ── LAYOUT ── */
  .container { max-width:960px; margin:0 auto; padding:0 16px; }
  header { background:#fff; border-bottom:1px solid #e2e8f0; position:sticky; top:0; z-index:100; }
  header .inner { padding:14px 16px; max-width:960px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:10px; }
  header .meta { font-size:11px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  header h1 { font-size:22px; font-weight:800; color:#0f172a; }
  header .sub { font-size:14px; color:#475569; margin-top:2px; }
  .badges { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .badge { font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px; border:1px solid; }
  .badge-pur { background:var(--pur-bg); color:var(--pur-text); border-color:var(--pur-border); }
  .badge-tea { background:var(--tea-bg); color:var(--tea-text); border-color:var(--tea-border); }
  .badge-blu { background:var(--blu-bg); color:var(--blu-text); border-color:var(--blu-border); }
  .badge-amb { background:var(--amb-bg); color:var(--amb-text); border-color:var(--amb-border); }
  .badge-cor { background:var(--cor-bg); color:var(--cor-text); border-color:var(--cor-border); }
  .badge-grn { background:var(--grn-bg); color:var(--grn-text); border-color:var(--grn-border); }
  .badge-slate { background:#f1f5f9; color:#475569; border-color:#e2e8f0; }
  .btn-print { font-size:11px; font-weight:500; color:#64748b; border:1px solid #e2e8f0; background:#fff; border-radius:8px; padding:5px 10px; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .btn-print:hover { background:#f8fafc; }
  main { padding:20px 16px 40px; max-width:960px; margin:0 auto; }

  /* ── SEARCH ── */
  .search-wrap { position:relative; max-width:480px; margin-bottom:16px; }
  .search-wrap input { width:100%; padding:8px 34px 8px 32px; border:1px solid #e2e8f0; border-radius:10px; font-family:inherit; font-size:13px; background:#fff; color:#1e293b; outline:none; }
  .search-wrap input:focus { border-color:#94a3b8; box-shadow:0 0 0 2px rgba(148,163,184,.2); }
  .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:#94a3b8; pointer-events:none; }
  .search-clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px; color:#94a3b8; background:none; border:none; line-height:1; display:none; }
  .search-results { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); background:#fff; border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.1); z-index:200; overflow:hidden; max-height:340px; overflow-y:auto; }
  .search-results.show { display:block; }
  .search-hint { padding:8px 12px 6px; font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:.06em; }
  .search-item { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:8px 12px; cursor:pointer; border-top:1px solid #f1f5f9; text-align:left; width:100%; background:none; border-left:none; border-right:none; border-bottom:none; font-family:inherit; }
  .search-item:hover { background:#f8fafc; }
  .search-item-body { flex:1; }
  .search-item-meta { display:flex; align-items:center; gap:5px; margin-bottom:3px; flex-wrap:wrap; }
  .search-item-subject { font-size:12px; font-weight:600; color:#1e293b; }
  .search-item-preview { font-size:11px; color:#64748b; line-height:1.4; }
  .search-empty { padding:16px 12px; text-align:center; font-size:13px; color:#94a3b8; }
  mark { background:#fef08a; color:#854d0e; border-radius:2px; padding:0 1px; }

  /* ── TABS ── */
  .tab-nav { display:flex; flex-wrap:wrap; gap:4px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:5px; margin-bottom:24px; box-shadow:var(--shadow); }
  .tab-btn { display:flex; align-items:center; gap:6px; font-family:inherit; font-size:13px; font-weight:500; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; background:none; color:#64748b; white-space:nowrap; }
  .tab-btn.active { font-weight:600; }
  .tab-btn[data-tab="mapa"].active     { background:#eff6ff; color:#1d4ed8; }
  .tab-btn[data-tab="primer"].active   { background:var(--pur-bg); color:var(--pur-text); }
  .tab-btn[data-tab="segundo"].active  { background:var(--tea-bg); color:var(--tea-text); }
  .tab-btn[data-tab="etico"].active    { background:#fffbeb; color:#92400e; }
  .tab-btn[data-tab="rubrica"].active  { background:#f1f5f9; color:#334155; }
  .panel { display:none; }
  .panel.active { display:block; }

  /* ── CARDS ── */
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .card-header { padding:16px 18px; border-bottom:1px solid #f1f5f9; background:#fafafa; }
  .card-body { padding:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
  @media(max-width:640px) { .grid2 { grid-template-columns:1fr; } .grid4 { grid-template-columns:1fr 1fr; } }

  /* ── MAPA ── */
  .mapa-hero { text-align:center; margin-bottom:28px; }
  .mapa-hero h2 { font-size:22px; font-weight:800; color:#1e293b; margin-bottom:6px; }
  .mapa-hero p { font-size:14px; color:#475569; }
  .cycle-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px; }
  @media(max-width:580px) { .cycle-grid { grid-template-columns:1fr; } }
  .cycle-card { border-radius:var(--radius); overflow:hidden; border:1px solid; box-shadow:var(--shadow); }
  .cycle-card.pur { border-color:var(--pur-border); }
  .cycle-card.tea { border-color:var(--tea-border); }
  .cycle-card-head { padding:12px 16px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .cycle-card.pur .cycle-card-head { background:var(--pur-bg); color:var(--pur-text); }
  .cycle-card.tea .cycle-card-head { background:var(--tea-bg); color:var(--tea-text); }
  .cycle-num { width:26px; height:26px; border-radius:50%; background:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .cycle-card.pur .cycle-num { color:var(--pur-text); }
  .cycle-card.tea .cycle-num { color:var(--tea-text); }
  .cycle-card-body { padding:14px 16px; background:#fff; }
  .cycle-row { padding:10px 0; }
  .cycle-row + .cycle-row { border-top:1px solid #f1f5f9; }
  .cycle-row .glabel { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid; display:inline-block; margin-bottom:4px; }
  .cycle-row h4 { font-size:13px; font-weight:700; color:#1e293b; margin-bottom:3px; }
  .cycle-row p { font-size:12px; color:#475569; }
  .ejes-section { margin-top:24px; padding-top:24px; border-top:1px solid #e2e8f0; }
  .ejes-title { text-align:center; font-size:18px; font-weight:700; color:#1e293b; margin-bottom:16px; }
